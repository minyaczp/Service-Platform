<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service UI placeholder</title>
    <style>
      html, body { margin: 0; height: 100%; background: #060a12; color: #e6edf5; font-family: 'Instrument Sans', system-ui, sans-serif; }
      .wrap { height: 100%; display: grid; place-items: center; text-align: center; }
      .name { font-size: 20px; font-weight: 600; }
      .note { margin-top: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #7f8da3; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="name" id="name">Service</div>
        <div class="note">SERVICE UI PLACEHOLDER — the service's own frontend loads here</div>
      </div>
    </div>
    <script>
      // Shows the id passed by Gridline (?id=<service id>); textContent keeps it inert.
      const id = new URLSearchParams(location.search).get('id') || 'unknown';
      document.getElementById('name').textContent = id + ' — service UI placeholder';
    </script>
  </body>
</html>
